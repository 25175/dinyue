# dinyue 单一规则源文件
#
# 用途：只改这一份文件，然后运行 `python3 scripts/generate.py`，自动生成：
#   - rules/custom.list      通用规则行
#   - surge/custom.list      Surge RULE-SET 可引用的规则列表
#   - clash/custom.yaml      Clash rule-providers 可引用的 payload
#   - mihomo/custom.yaml     Mihomo rule-providers 可引用的 payload
#   - loon/custom.list       Loon 兼容列表
#   - quanx/custom.list      Quantumult X 兼容列表
#   - sing-box/custom-source.json  结构化备份/转换源
#
# 推荐引用地址：
#   Surge：
#     复制 surge/rule-set-lines.conf 里的多条 RULE-SET 到 [Rule] 靠前位置。
#     脚本会按 surge_policy_map 自动把 Clash/Mihomo 策略名映射到当前 Surge 策略组，并拆分成多个远程列表。
#     Surge 远程 split RULE-SET 只放 DOMAIN、DOMAIN-SUFFIX、IP-CIDR、IP-CIDR6、GEOIP 这类稳妥类型；
#     DOMAIN-KEYWORD、DST-PORT、嵌套 RULE-SET 等保留到 surge/inline-rules.conf，需按需直接复制到 [Rule]。
#
#   Clash/Mihomo：先在 rule-providers 增加：
#     dinyue-custom:
#       type: http
#       behavior: classical
#       format: yaml
#       url: "https://raw.githubusercontent.com/25175/dinyue/main/clash/custom.yaml"
#       path: ./ruleset/dinyue-custom.yaml
#       interval: 86400
#     然后在 rules 靠前位置增加：
#       - RULE-SET,dinyue-custom,Proxy
#
# 为什么 Clash/Mihomo 用 behavior: classical：
#   因为这里包含 DOMAIN、DOMAIN-SUFFIX、DOMAIN-KEYWORD、IP-CIDR、IP-CIDR6、DST-PORT、RULE-SET
#   等混合规则类型，不是纯 domain/ipcidr 列表。
#   Clash/Mihomo classical 支持这些混合类型放在同一个 rule-provider payload 里。
#   Surge 远程 RULE-SET 不适合混放所有类型，所以脚本会拆分远程列表与 inline 规则。
#
# YAML 编辑格式说明：
#   1. 缩进只能用空格，不要用 Tab。
#   2. 推荐每条规则写成一行：`- {type: DOMAIN, value: "example.com", policy: DIRECT, comment: "说明"}`。
#   3. 也可以写成多行：`- type:` 开头，下面字段保持两个空格缩进。
#   4. value/comment 里如果包含冒号、#、逗号、emoji 或特殊符号，建议加英文双引号。
#   5. policy 必须写目标策略组/策略名，例如 DIRECT、REJECT、Proxy、SF3、🎯 全球直连、👋 手动选择。
#   6. option 可省略；常见值是 no-resolve。省略时不要写空逗号。
#   7. enabled: false 可临时禁用一条规则；不写 enabled 时默认启用。
#   8. comment 只是给人看的说明，不会写入最终规则行。
#   9. 一条规则最终只会生成：TYPE,VALUE,POLICY 或 TYPE,VALUE,POLICY,OPTION。
#
# 推荐一行示例：
#   - {type: DOMAIN, value: "example.com", policy: DIRECT, comment: "精确匹配 example.com"}
#   - {type: DOMAIN-SUFFIX, value: "example.com", policy: Proxy, comment: "域名后缀匹配 example.com 及其子域名，不是关键词包含匹配"}
#   - {type: DOMAIN-KEYWORD, value: "example", policy: Proxy, comment: "关键词包含匹配；Surge 中建议放 inline-rules.conf"}
#   - {type: IP-CIDR, value: "1.2.3.4/32", policy: DIRECT, option: no-resolve, comment: "IP 规则通常建议加 no-resolve"}
#
# 多行示例也支持：
#   - type: DOMAIN
#     value: example.com
#     policy: DIRECT
#     comment: 精确匹配 example.com
#
# 支持的 type：
#   DOMAIN, DOMAIN-SUFFIX, DOMAIN-KEYWORD, DOMAIN-SET, IP-CIDR, IP-CIDR6,
#   GEOIP, DST-PORT, SRC-IP-CIDR, PROCESS-NAME, RULE-SET
#
comments:
  - "# 自定义规则：源数据由 xiugai.yaml 维护"
  - "# 修改后运行：python3 scripts/generate.py；或在 GitHub 网页直接改 xiugai.yaml 触发 Actions 自动生成"
  - "# Clash/Mihomo 保留原 policy；Surge 会按 surge_policy_map 自动映射并拆分"

# Surge 策略组映射：左边是 xiugai.yaml 里写的 policy，右边是当前 Surge [Proxy Group] 里存在的策略。
# SF3 在 Surge Family 中对应带国旗的日本节点策略组；如果你的 Surge 策略组名称不同，请改成实际策略组名。
surge_policy_map:
  "🎯 全球直连": DIRECT
  "👋 手动选择": Proxy
  SF3: "🇯🇵 日本节点"

