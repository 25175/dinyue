name: Sync curated QX advertising lists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_qx_adblock.py"
      - ".github/workflows/sync-qx-adblock.yml"
      - "LICENSES/NobyDa-ND-AD-MIT.txt"
      - "LICENSES/NobyDa-Script-GPL-3.0.txt"
      - "LICENSES/blackmatrix7-ios_rule_script-GPL-2.0.txt"

permissions:
  contents: write

concurrency:
  group: sync-curated-qx-advertising-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate curated QX advertising lists
        run: python3 scripts/sync_qx_adblock.py

      - name: Verify generated artifacts
        run: python3 scripts/sync_qx_adblock.py --check

      - name: Commit updated rule lists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动同步清洗版 QX 广告规则"
          file_pattern: "QuantumultX/AD_Block_Plus.txt QuantumultX/AdRule.list QuantumultX/Advertising.list"
