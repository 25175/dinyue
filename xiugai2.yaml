# dinyue 全中文规则源文件（与 xiugai.yaml 等价，二选一或同时用均可）
#
# 在这里用全中文写规则，push 后 GitHub Actions 自动转换并合并进所有客户端产物
# （Surge/Clash/Mihomo/Loon/QuantumultX/sing-box），效果与写在 xiugai.yaml 完全一致。
# 本文件的规则排在 xiugai.yaml 规则之后。
#
# 字段（全中文）：
#   类型：域名 | 域名后缀 | 域名关键词 | 域名集 | IP段 | IPV6段 | 地理IP | 目标端口 | 来源IP段 | 进程名 | 规则集
#   值：  域名 / IP 段 / 端口等
#   策略：代理 | 直连 | 全球直连 | 拒绝(拦截) | AI(智能助理) | 日本(日本节点)
#         也可直接写英文策略名（如 AIGC）或自定义组名，将原样透传
#   选项：可选，如 no-resolve（IP 类规则用）
#   备注：可选，说明文字
#   启用：可选，写 否 则该条不生效（默认生效）
#
# 写法示例（去掉行首 # 即生效）：
#   - {类型: 域名后缀, 值: example.com, 策略: 代理, 备注: "示例：整个域走代理"}
#   - {类型: 域名, 值: api.example.com, 策略: AI, 备注: "示例：单个域名进 AIGC 组"}
#   - {类型: IP段, 值: 1.2.3.4/32, 策略: 直连, 选项: no-resolve}
#   - {类型: 域名后缀, 值: old.example.com, 策略: 拒绝, 启用: 否, 备注: "示例：暂时停用"}
#
# 注意：缩进只能用空格；值里有冒号、# 或 emoji 时加英文双引号。

规则: []
