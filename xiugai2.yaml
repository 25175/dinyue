# dinyue 全中文规则源文件（与 xiugai.yaml 等价，二选一或同时用均可）
#
# 在这里用全中文写规则，push 后 GitHub Actions 自动转换并合并进所有客户端产物
# （Surge/Clash/Mihomo/Loon/QuantumultX/sing-box）。
# 改本文件或改 xiugai.yaml 都会自动触发更新，效果完全一致。
# 本文件的规则排在 xiugai.yaml 规则之后。
#
# 字段（全中文）：
#   类型：见下方 11 种样例
#   值：  域名 / IP 段 / 端口等
#   策略：代理 | 直连 | 全球直连 | 拒绝(拦截) | AI(智能助理) | 日本(日本节点)
#         也可直接写英文策略名（如 AIGC）或自定义组名，将原样透传
#   选项：可选，如 no-resolve（IP 类规则用）
#   备注：可选，说明文字
#   启用：可选，写 否 则该条不生效（默认生效）
#
# ── 每种类型一条样例（去掉行首 # 即生效）──────────────────────────
#
# 1. 域名 —— 精确匹配单个域名
#   - {类型: 域名, 值: chat.example.com, 策略: AI, 备注: "只匹配 chat.example.com 本身"}
#
# 2. 域名后缀 —— 匹配该域名及其所有子域名（最常用）
#   - {类型: 域名后缀, 值: example.com, 策略: 代理, 备注: "example.com 和 *.example.com 全走代理"}
#
# 3. 域名关键词 —— 域名中包含该关键词即命中（Surge 端为内联规则，见 inline-rules.conf）
#   - {类型: 域名关键词, 值: tracker, 策略: 拒绝, 备注: "域名含 tracker 字样的全部拦截"}
#
# 4. 域名集 —— 引用外部纯域名列表文件（值为列表 URL）
#   - {类型: 域名集, 值: "https://ruleset.skk.moe/List/domainset/reject.conf", 策略: 拒绝, 备注: "整份域名列表拦截"}
#
# 5. IP段 —— 匹配 IPv4 CIDR；建议加 no-resolve 避免为纯 IP 规则触发域名解析
#   - {类型: IP段, 值: 8.8.8.0/24, 策略: 直连, 选项: no-resolve, 备注: "该 IPv4 段直连"}
#
# 6. IPV6段 —— 匹配 IPv6 CIDR
#   - {类型: IPV6段, 值: "2001:4860:4860::/48", 策略: 直连, 选项: no-resolve, 备注: "该 IPv6 段直连"}
#
# 7. 地理IP —— 按 IP 归属国家/地区匹配（值为国家代码）
#   - {类型: 地理IP, 值: JP, 策略: 日本, 备注: "解析到日本 IP 的流量走日本节点"}
#
# 8. 目标端口 —— 按目标端口匹配（Surge 端为内联规则，见 inline-rules.conf）
#   - {类型: 目标端口, 值: 8443, 策略: 代理, 备注: "目标端口 8443 走代理"}
#
# 9. 来源IP段 —— 按发起请求的局域网设备 IP 匹配（如给某台设备单独定策略）
#   - {类型: 来源IP段, 值: 192.168.1.88/32, 策略: 全球直连, 备注: "这台设备的流量全部直连"}
#
# 10. 进程名 —— 按发起请求的程序名匹配（仅 Surge/Loon 等桌面端支持）
#   - {类型: 进程名, 值: Telegram, 策略: 代理, 备注: "Telegram 程序的流量走代理"}
#
# 11. 规则集 —— 引用外部规则集（值为规则集名或 URL；Surge 端为内联规则）
#   - {类型: 规则集, 值: adblock, 策略: 拒绝, 备注: "引用名为 adblock 的规则集"}
#
# ── 其他写法演示 ────────────────────────────────────────────────
#
# 暂时停用一条规则（保留不删，随时改回）：
#   - {类型: 域名后缀, 值: old.example.com, 策略: 拒绝, 启用: 否, 备注: "先留着，暂不生效"}
#
# 直接写英文策略名或自定义组名（原样透传）：
#   - {类型: 域名后缀, 值: dev.example.com, 策略: AIGC}
#
# 注意：缩进只能用空格；值里有冒号、#、逗号或 emoji 时加英文双引号。
# 正式写规则时，删掉下面的 []，按上面样式一行一条往下加即可。

规则: []
